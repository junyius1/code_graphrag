[project]
name = "code-graphrag"
version = "0.1.0"
description = "Code GraphRAG: deterministic code knowledge graphs (CST/AST) + Microsoft GraphRAG indexing and querying for source repositories"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Microsoft GraphRAG (v3 line, matches 3partylibs/graphrag source tree)
    "graphrag>=3.1.2,<3.2.0",
    # LangGraph for workflow orchestration (matches 3partylibs/langgraph 1.2.x)
    "langgraph>=1.2.11,<1.3.0",
    # LangChain v1 for LLM / structured output / embeddings (matches 3partylibs/langchain 1.3.x)
    "langchain>=1.3.17,<1.4.0",
    "langchain-openai>=1.6.0,<1.7.0",
    # Deep Agents for the interactive code exploration agent (matches 3partylibs/deepagents 0.7.x)
    "deepagents>=0.7.8,<0.8.0",
    # Deterministic code parsing
    "tree-sitter>=0.24.0,<1.0.0",
    "tree-sitter-language-pack>=1.11.0,<1.16.0",
    "networkx>=3.6.0,<4.0.0",
    # CLI / config / data
    "typer>=0.15.0,<1.0.0",
    "rich>=13.9.0,<14.0.0",
    "pydantic>=2.7.4,<3.0.0",
    "pydantic-settings>=2.4.0,<3.0.0",
    "PyYAML>=6.0.2,<7.0.0",
    "pandas>=3.0.0,<3.1.0",
    "pyarrow>=25.0.0,<26.0.0",
    "tiktoken>=0.9.0,<1.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-asyncio>=0.25.0,<1.0.0",
    "ruff>=0.8.0,<1.0.0",
]

[project.scripts]
code-graphrag = "code_graphrag.cli.app:app"

[build-system]
requires = ["hatchling>=1.27.0,<2.0.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_graphrag", "src/graphrag_query"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
"src/code_graphrag/cli/*.py" = ["B008"]  # Typer Option() in defaults is the standard pattern
